[project]
name = "llmapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JanaAshraf975", email = "ganaashraf79@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=3.49.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
llmapi = "llmapi:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
